# =====================================================================
# CoinFull Prime (市場中性截面多空 Alpha 策略) 設定檔
# v2 + 風險閘門（依 docs/CoinFull_Prime_Audit_Report_2026-09-16.md
# §5 建議新配置 與 docs/CoinFull_Prime_01_Profit_Optimization_Plan.md 階段 A/B）
# =====================================================================

strategy:
  id: "coinfull_prime"
  name: "CoinFull Prime Market Neutral"
  description: "Asymmetric Market Neutral Alpha Strategy (Top 5 Longs + BTC Benchmark Hedge + -12% Intra-week Stop Loss, v3.0)"
  version: "3.0.0"

# 標的池（Universe 80）過濾設定
universe:
  top_n: 80
  quote_asset: "USDT"
  exclude_tradfi: true       # 排除非加密合約 (美股、股票、指數 ETF、大宗商品等 TradFi，維持純加密中性)
  min_24h_volume_usdt: 50000000.0  # Opt D 質量初篩：24h 成交額 >= 5000 萬 USDT (排除極端微盤垃圾幣)
  max_7d_atr_pct: 0.20             # Opt D 波動過濾：7 日平均真實振幅 ATR/Price <= 20%
  # 人工審核黑名單：精確 symbol（大小寫不敏感），不是交易所 tag 資料源。
  # 交易所沒有穩定的 MEME/AI_AGENT tag，需由人工填入並記錄審核理由。
  restricted_symbols: []
  exclude_stables:
    - "USDCUSDT"
    - "FDUSDUSDT"
    - "TUSDUSDT"
    - "USDPUSDT"
    - "EURUSDT"
    - "BUSDUSDT"
    - "AEURUSDT"
    - "USDEUSDT"
    - "BFDUSDUSDT"

# 因子加權設定 (加總必須為 1.0)
weights:
  momentum: 0.60     # 多時距平滑動能（順勢成分）
  flow: 0.0          # 已移除
  funding: 0.40      # 資金費率（carry 收息 / 兩階段安全門檻）
  liquidation: 0.0   # 已移除

# 動能因子形式 (v3.0 Opt C / Master Spec 2.1)
momentum:
  mode: "blend"            # "blend" = 多時距平滑混合 (7d/14d/30d)
  blend:
    r1d: 0.0               # v3 徹底移除單日動能噪音 (防追高反噬)
    r7d: 0.5               # 7d 動能權重 50%
    r14d: 0.3              # 14d 動能權重 30%
    r30d: 0.2              # 30d 動能權重 20%
  overheat_penalty: true   # 短線防夾保護：若 1d 漲幅 > 65% of 7d 漲幅 (7d > 0)，評分乘 0.5

# 資金費率因子形式與兩階段過濾門檻
funding:
  mode: "smooth"           # 最近 9 次 8 小時結算平均 (3 日平滑，平抑單點雜訊，對齊 Master Spec 2.1.4)
  settlements: 9
  annual_max_long_pct: 60.0    # 多頭候選年化資費上限 (+60%)，超過則強制剔除防高息爆雷
  annual_min_short_pct: -40.0  # 空頭候選年化資費下限 (-40%)，低於則強制剔除防高息軋空

# 非對稱空頭對沖配置 (v3.0 Opt C 核心架構)
hedge:
  mode: "benchmark"        # "benchmark" = 50% 名義資金單主流 BTC 對沖 (Opt C 推薦)
                           # "dual_benchmark" = 25% BTC + 25% ETH (Opt B 雙主流)
                           # "basket" = 傳統倒序小幣空頭籃子 (v2 舊版相容)
  symbol: "BTCUSDT"        # 基準對沖合約代碼
  weight: 0.50             # 空頭總資金佔比 (50% 名義本金)
  dual_weights:
    BTCUSDT: 0.25
    ETHUSDT: 0.25

# 週內事中動態風控 (Intra-week Risk Control)
risk_control:
  intra_week_stop_loss_pct: -0.12  # 多頭單幣硬止損 (-12.0%)，觸發後以市價 reduceOnly 平倉並鎖定為現金
  order_type: "MARKET"
  reduce_only: true
  monitor_interval_seconds: 5      # 盤中監控頻率 (秒)

# 投資組合與換倉設定
portfolio:
  long_count: 5                # 做多標的數量 (Top 5，每檔 10% 總資金)
  short_count: 1               # 空頭標的數量 (benchmark 模式下為 1 檔 BTCUSDT 佔 50%)
  total_capital_usdt: 1000.0   # 總投入名義本金 (USDT)
  leverage: 1.0                # 槓桿倍數 (總名義倉位 1.0x)
  exchange: "paper"            # 目標交易所: paper (模擬撮合), binance (幣安實盤)
  dry_run: true                # true: 僅計算日誌，不發真實訂單; false: 實際發單
  max_slippage_pct: 0.005      # 最大允許市價滑點 (0.5%)
  execution_style: "batch"     # batch: 批次限速發單; twap: 時間加權分批

# 排程與運行設定
# v2 優化：每日 UTC 00:00 → 每週四 UTC 00:05（成本 ~40%/年 → ~2.9%/年）
schedule:
  rebalance_days: 7            # 換倉週期（日）；7 = 固定在 execution_weekday 每週一次
                               # 其他值 = 自 schedule_anchor_date 起每 N 日（週內漂移）
  execution_weekday: 3         # Python weekday 慣例：週一=0 ... 週四=3 ... 週日=6
                               # （週六/週日換倉實測明顯較差，務必避開）
  execution_minute_utc: 5      # UTC 00:05（避開 00:00 整點的資金費率結算與日線收盤瞬間）
  timezone: "UTC"
  timeout_seconds: 60          # 整個計算與換倉流程逾時時間 (秒)

# 風險閘門 (Regime Gate)
# 規格：docs/CoinFull_Prime_03_NoTrade_Trigger_Spec.md
#   T1 風險關閉停單（pts=0 → 平倉並停止下單）— 最大單一改善項
#   T2 崩跌日延後換倉（BTC 收盤日 ≤ -5% → 延後 24 小時，最多 2 次）
#   T5 極端擁擠保護（資金費率百分位 >90 禁止加碼；>95 且 pts≤1 減半）
# 實作：core/services/coinfull_prime/regime_filter.py
regime_gate:
  enabled: true
  log_only: false         # false = 依 pts 嚴格執行平倉/縮倉 (生產模式，符合 Master Spec pts==0 全平)
  # 生產環境必須為 false；若需觀察期請在監控層告警而非覆蓋決策
  mode: "flatten"          # flatten(保守版) pts=0→0x 停單 | soft(積極版) pts=0→0.35x
  trend_ma_days: 50        # 元件1 趨勢：BTC 收盤 > N 日 SMA
  breadth_threshold_pct: 30.0   # 元件2 廣度：宇宙站上 50 日 SMA 比例 > 30%
  funding_percentile_days: 252  # 元件3 情緒：全市場資金費率的 N 日百分位
  funding_threshold_pct: 45.0   # 資金費率百分位 > 45 才算「市場願意付費」
  risk_off_scale: 0.35     # soft 模式下 pts=0 的部分倉位倍數
  scale_up:                # 加碼條件：pts==2 且資金費率百分位在區間內
    enabled: true
    min_pctile: 45.0
    max_pctile: 80.0       # > 80 視為擁擠，不加碼
    multiplier: 1.15
    max_multiplier: 1.2    # 硬上限
  crash_defer:             # T2 崩跌日延後換倉
    enabled: true
    btc_ret_1d_pct: -5.0   # BTC 最近收盤日報酬 ≤ -5% → 延後
    max_defers: 2          # 最多連續延後 2 次
  extreme_crowding:        # T5 極端擁擠保護
    no_scale_up_above_pctile: 90.0
    halve_above_pctile: 95.0   # 且 pts ≤ 1 時降至 0.5x
