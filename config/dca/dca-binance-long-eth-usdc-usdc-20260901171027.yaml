dca:
  exchange: binance
  symbol: ETH/USDC:USDC
  direction: long
  account_mode: live
  leverage: 125
  margin_mode: isolated
  quantity_precision: 3
  price_decimals: 2
  fee_rate: '0.0004'
  base_order_amount: '40.0'
  amount_unit: quote
  dca_mode: order
  averaging_method: fixed_value
  max_safety_orders: 20
  price_deviation_percent: '0.8'
  price_deviation_multiplier: '1.2'
  order_size_multiplier: '1.0'
  take_profit_percent: '1.0'
  take_profit_order_type: limit
  stop_loss_percent: null
  max_position_notional: null
  repeat_after_take_profit: true
  cooldown_seconds: 300
  max_cycles: null
  both_tiebreak: long_first
  active_safety_orders_window: 5
  monitoring_interval: 15
  indicator_refresh_interval: 60
  order_health_check_interval: 300
  entry:
    mode: indicator
    logic: all
    timeframe: 15m
    fetch_limit: 300
    price_source: close
    confirm_bars: 1
    max_wait_seconds: null
    indicators:
    - type: bollinger
      period: 20
      std_dev: 2.0
      condition: touch
metadata:
