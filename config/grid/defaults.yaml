# ═══════════════════════════════════════════════════════════════════════
# 全局網格系統默認值 (Grid System Defaults)
# ═══════════════════════════════════════════════════════════════════════
#
# 此文件中的值會被個別幣對 YAML 中的同名字段覆蓋。
# 優先級：代碼硬編碼默認值 ← defaults.yaml ← 個別幣對 YAML
#
# 這些參數屬於「系統架構、風控、精確度」層面，
# 不應在每個幣對配置中重複出現。
# ═══════════════════════════════════════════════════════════════════════

grid_defaults:

  # ─────────────────────────────────────────────────────────────────────
  # 速率限制與同步參數
  # ─────────────────────────────────────────────────────────────────────
  # 固定後，單個網格每小時 REST API 基底消耗 = 90 次
  #   = 3600/active_window_refresh_interval + 3600/rest_position_query_interval
  #   = 3600/60 + 3600/120 = 60 + 30 = 90 次/小時
  #
  # N 個機器人總消耗 = 90N 次/小時
  # Binance 限制: 6000 weight/min
  # ─────────────────────────────────────────────────────────────────────
  active_window_each_side: 2
  active_window_refresh_interval: 60     # 秒（活躍窗口刷新間隔）
  order_health_check_enabled: true
  order_health_check_interval: 180       # 秒（訂單健康檢查間隔）每次約消耗 6~8 次 REST API，180秒=每小時20次健康檢查≈150次API，遠低於Binance限額
  health_check_adjust_position_enabled: false
  rest_position_query_interval: 120      # 秒（REST 持倉查詢間隔）
  ws_only_mode: true                     # WebSocket 為主要數據源
  rest_backup_enabled: false             # 禁用 REST 備用查詢

  # ─────────────────────────────────────────────────────────────────────
  # 風控與執行參數
  # ─────────────────────────────────────────────────────────────────────
  limit_only: true                       # 全系統僅限價執行（禁用市價單）
  reverse_order_grid_distance: 1         # 反手掛單格距
  fee_rate: 0.000                        # 手續費率（VIP 等級決定）

  # ─────────────────────────────────────────────────────────────────────
  # 容錯公差（系統穩定度，非市場策略）
  # ─────────────────────────────────────────────────────────────────────
  position_tolerance:
    amount_diff: 0.006
    price_diff: 0.1
