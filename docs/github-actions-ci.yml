# Copy this file to .github/workflows/ci.yml when the repository token has
# the `workflows` permission. Until then, run scripts/ci.sh locally or in
# any runner that can execute bash.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.104.1 uvicorn==0.24.0 pydantic==2.5.0 pyyaml==6.0.1 httpx==0.25.2 python-dotenv==1.0.0
      - name: Run unittest suite
        run: |
          python -m unittest \
            tests.test_lifecycle_and_safety \
            tests.test_paper_adapter \
            tests.test_command_repository \
            tests.test_runtime_repository \
            tests.test_paper_grid_lifecycle_e2e \
            tests.test_frontend_format_contract \
            tests.test_dashboard_snapshot \
            tests.test_web_ui_http_contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_ui/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
